# Configuration for Virtual Girlfriend AI

[ollama]
# Ollama server configuration
base_url = http://localhost:11434
model = mistral
# Other options: neural-chat, dolphin-mixtral, orca-mini, zephyr

[tts]
# Text-to-Speech configuration
provider = pyttsx3
# Options: pyttsx3 (local/free), elevenlabs (premium), google, azure
voice_id = default_sweet_female
# Elevenlabs voices: bella, alice, nova
sample_rate = 16000
volume = 0.9
rate = 150

[audio]
# Audio processing configuration
sample_rate = 16000
channels = 1
recording_duration = 10
device_index = null  # null = default, or specify device number

[video]
# Video processing configuration
frame_rate = 30
output_resolution = [1280, 720]
# Watermark settings
add_watermark = true
watermark_text = "💕 Virtual Girlfriend"
watermark_opacity = 0.25
watermark_position = "bottom-right"
blur_old_watermarks = true

[personality]
# Personality settings
possessiveness = 0.8  # 0-1 scale
jealousy_level = 0.7
caring_level = 0.9
playfulness = 0.8
trust_level = 0.5

[language]
# Supported languages
default = "en"
supported = [
    "en",      # English
    "es",      # Spanish
    "fr",      # French
    "de",      # German
    "hi",      # Hindi
    "ja",      # Japanese
    "zh",      # Mandarin Chinese
    "pt",      # Portuguese
    "ru",      # Russian
]

[database]
# Database configuration
type = sqlite
path = ./virtualgirlfriend.db
