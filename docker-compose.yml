services:
  postgres:
    image: postgres:16-alpine
    container_name: virtualgirlfriend-postgres
    environment:
      POSTGRES_DB: virtualgirlfriend
      POSTGRES_USER: virtualgirlfriend
      POSTGRES_PASSWORD: virtualgirlfriend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtualgirlfriend -d virtualgirlfriend"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: virtualgirlfriend-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtualgirlfriend-app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      LOG_LEVEL: INFO
      PORT: "5000"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      TTS_PROVIDER: pyttsx3
      DATABASE_URL: postgresql+psycopg://virtualgirlfriend:virtualgirlfriend@postgres:5432/virtualgirlfriend
    ports:
      - "5000:5000"
    volumes:
      - ./audio_input:/app/audio_input
      - ./audio_output:/app/audio_output
      - ./processed_videos:/app/processed_videos
      - ./temp:/app/temp
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
